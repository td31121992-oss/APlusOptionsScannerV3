name: Shadow Classifier Tests

on:
  pull_request:
    paths:
      - "breakout_breakdown_shadow.py"
      - "tests/test_breakout_breakdown_shadow.py"
      - ".github/workflows/shadow-classifier-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated shadow tests
        run: python -m unittest discover -s tests -p "test_breakout_breakdown_shadow.py" -v
